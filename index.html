<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memórias do João</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #03020a;
  --deep: #070514;
  --nebula1: #6e2bff;
  --nebula2: #c026d3;
  --nebula3: #0ea5e9;
  --nebula4: #10b981;
  --star: #f0e6ff;
  --stardust: rgba(240,230,255,0.55);
  --glass: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.10);
  --era1: #f97316;
  --era2: #a78bfa;
  --era3: #34d399;
  --text: #e8e0ff;
  --muted: rgba(232,224,255,0.45);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--void);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  cursor: none;
}

/* ── CUSTOM CURSOR ── */
.cursor {
  position: fixed;
  width: 10px; height: 10px;
  background: var(--nebula1);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform 0.08s, width 0.2s, height 0.2s, background 0.2s;
  mix-blend-mode: screen;
}
.cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1px solid rgba(110,43,255,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%,-50%);
  transition: transform 0.18s ease-out, width 0.25s, height 0.25s;
}

/* ── STAR CANVAS ── */
#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── NEBULA BLOBS ── */
.nebula {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.18;
  animation: drift 18s ease-in-out infinite alternate;
}
.nb1 { width: 600px; height: 600px; background: var(--nebula1); top: -200px; left: -200px; animation-delay: 0s; }
.nb2 { width: 500px; height: 500px; background: var(--nebula2); bottom: -150px; right: -100px; animation-delay: -6s; }
.nb3 { width: 400px; height: 400px; background: var(--nebula3); top: 40%; left: 50%; animation-delay: -12s; }

@keyframes drift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(40px,30px) scale(1.08); }
}

/* ── HEADER ── */
header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 4rem 1rem 3rem;
}

.logo-orbit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 1px solid rgba(110,43,255,0.4);
  margin-bottom: 1.5rem;
  position: relative;
  animation: spin 12s linear infinite;
}
.logo-orbit::before {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  background: var(--nebula3);
  border-radius: 50%;
  top: -5px; left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 12px var(--nebula3);
}
@keyframes spin { to { transform: rotate(360deg); } }

.site-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2.2rem, 7vw, 4.5rem);
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, #c4b5fd 0%, #818cf8 40%, #38bdf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.03em;
}

.site-sub {
  margin-top: 0.6rem;
  font-size: 0.8rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 300;
}

/* ── YEAR NAV ── */
nav {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 0 1rem 2rem;
  flex-wrap: wrap;
}

.year-tab {
  font-family: 'Outfit', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0.45rem 1.2rem;
  cursor: pointer;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  border-radius: 99px;
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}
.year-tab:hover { color: var(--text); border-color: rgba(110,43,255,0.5); }
.year-tab.active {
  color: #fff;
  background: linear-gradient(135deg, var(--nebula1), var(--nebula2));
  border-color: transparent;
  box-shadow: 0 0 20px rgba(110,43,255,0.4);
}

/* ── MAIN LAYOUT ── */
main {
  position: relative;
  z-index: 10;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1.5rem 6rem;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 2rem;
}

@media (max-width: 720px) {
  main { grid-template-columns: 1fr; }
  aside { position: static !important; }
}

/* ── SIDEBAR ── */
aside {
  position: sticky;
  top: 1.5rem;
  align-self: start;
}

.sidebar-label {
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 0.6rem;
  padding-left: 0.75rem;
}

.materia-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  color: var(--muted);
  padding: 0.55rem 0.75rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.18s;
  border-left: 2px solid transparent;
  position: relative;
}
.materia-btn:hover { color: var(--text); background: var(--glass); }
.materia-btn.active {
  color: #c4b5fd;
  background: rgba(110,43,255,0.12);
  border-left-color: var(--nebula1);
  font-weight: 500;
}

/* ── CONTENT AREA ── */
.content-area { min-height: 400px; }

.content-header {
  margin-bottom: 1.5rem;
}

.content-materia {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.4rem, 3vw, 2rem);
  font-weight: 700;
  color: var(--star);
  line-height: 1.2;
}

.content-breadcrumb {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 0.3rem;
  letter-spacing: 0.06em;
}

/* ── ERA PILLS ── */
.era-tabs {
  display: flex;
  gap: 0.6rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.era-btn {
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.45rem 1.1rem;
  border-radius: 99px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.2s;
  background: transparent;
  position: relative;
  overflow: hidden;
}

.era-btn[data-era="1"] { color: var(--era1); border-color: rgba(249,115,22,0.4); }
.era-btn[data-era="1"].active {
  background: var(--era1); color: #0a0500; border-color: var(--era1);
  box-shadow: 0 0 20px rgba(249,115,22,0.4);
}
.era-btn[data-era="2"] { color: var(--era2); border-color: rgba(167,139,250,0.4); }
.era-btn[data-era="2"].active {
  background: var(--era2); color: #07041a; border-color: var(--era2);
  box-shadow: 0 0 20px rgba(167,139,250,0.4);
}
.era-btn[data-era="3"] { color: var(--era3); border-color: rgba(52,211,153,0.4); }
.era-btn[data-era="3"].active {
  background: var(--era3); color: #020f09; border-color: var(--era3);
  box-shadow: 0 0 20px rgba(52,211,153,0.4);
}

/* ── CARD GRID ── */
.palacio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.25rem;
}

.palacio-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(.22,.68,0,1.2), box-shadow 0.25s, border-color 0.25s;
  backdrop-filter: blur(12px);
  animation: cardIn 0.4s ease both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.palacio-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(110,43,255,0.45);
  box-shadow: 0 16px 48px rgba(110,43,255,0.2), 0 0 0 1px rgba(110,43,255,0.2);
}

.palacio-img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}

.palacio-img-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(110,43,255,0.1), rgba(192,38,211,0.08));
  color: var(--muted);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}

.palacio-info {
  padding: 1rem 1.1rem 1.1rem;
  border-top: 1px solid var(--glass-border);
}

.palacio-titulo {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--star);
  margin-bottom: 0.3rem;
}

.palacio-desc {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.55;
}

.palacio-era-badge {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  margin-bottom: 0.4rem;
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--muted);
}
.empty-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  display: block;
  opacity: 0.5;
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.empty-state p { font-size: 0.9rem; line-height: 1.7; }

/* ── LIGHTBOX ── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(3,2,10,0.92);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(16px);
}
.lightbox.open { display: flex; }

.lightbox-inner {
  max-width: 860px;
  width: 100%;
  background: rgba(15,8,40,0.95);
  border: 1px solid rgba(110,43,255,0.3);
  border-radius: 20px;
  overflow: hidden;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 80px rgba(110,43,255,0.2);
  animation: lbIn 0.25s cubic-bezier(.22,.68,0,1.2);
}
@keyframes lbIn {
  from { opacity:0; transform: scale(0.92); }
  to   { opacity:1; transform: scale(1); }
}

.lightbox-img {
  width: 100%;
  max-height: 60vh;
  object-fit: contain;
  background: rgba(0,0,0,0.3);
  display: block;
}

.lightbox-body {
  padding: 1.5rem;
  border-top: 1px solid rgba(110,43,255,0.2);
  overflow-y: auto;
}

.lightbox-titulo {
  font-family: 'Syne', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--star);
  margin-bottom: 0.5rem;
}

.lightbox-desc {
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.7;
}

.lightbox-close {
  position: absolute;
  top: 1.25rem;
  right: 1.25rem;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  font-size: 1rem;
  width: 38px; height: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.lightbox-close:hover { background: rgba(255,255,255,0.15); }

/* ── FAB ADD ── */
.fab {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  z-index: 500;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, var(--nebula1), var(--nebula2));
  color: white;
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(110,43,255,0.5), 0 4px 16px rgba(0,0,0,0.4);
  transition: transform 0.2s cubic-bezier(.22,.68,0,1.2), box-shadow 0.2s;
  font-weight: 300;
  line-height: 1;
}
.fab:hover {
  transform: scale(1.12) rotate(90deg);
  box-shadow: 0 0 40px rgba(110,43,255,0.7), 0 6px 24px rgba(0,0,0,0.4);
}

/* ── ADMIN PANEL ── */
.admin-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(3,2,10,0.88);
  z-index: 600;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(12px);
}
.admin-overlay.open { display: flex; }

.admin-panel {
  background: rgba(10,6,30,0.98);
  border: 1px solid rgba(110,43,255,0.3);
  border-radius: 20px;
  padding: 2rem;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(110,43,255,0.15);
  animation: lbIn 0.25s cubic-bezier(.22,.68,0,1.2);
}

.admin-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--star);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.form-row { margin-bottom: 1rem; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
@media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }

.form-label {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.4rem;
  font-weight: 500;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 0.65rem 0.9rem;
  border: 1px solid rgba(110,43,255,0.25);
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--nebula1);
  box-shadow: 0 0 0 3px rgba(110,43,255,0.15);
}
.form-select option { background: #0a0620; }
.form-textarea { resize: vertical; min-height: 80px; }

.btn-save {
  width: 100%;
  margin-top: 0.75rem;
  padding: 0.8rem;
  border: none;
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, var(--nebula1), var(--nebula2));
  color: white;
  letter-spacing: 0.04em;
  transition: opacity 0.15s, transform 0.15s;
}
.btn-save:hover { opacity: 0.9; transform: translateY(-1px); }

.btn-cancel {
  width: 100%;
  margin-top: 0.5rem;
  padding: 0.7rem;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  transition: color 0.15s, border-color 0.15s;
}
.btn-cancel:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

.img-preview {
  width: 100%;
  border-radius: 10px;
  margin-top: 0.5rem;
  display: none;
  border: 1px solid rgba(110,43,255,0.2);
}

.hint {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 0.3rem;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(110,43,255,0.4); border-radius: 2px; }
</style>
</head>
<body>

<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="curRing"></div>

<div class="nebula nb1"></div>
<div class="nebula nb2"></div>
<div class="nebula nb3"></div>
<canvas id="starfield"></canvas>

<header>
  <div class="logo-orbit"></div>
  <h1 class="site-title">Memórias do João</h1>
  <p class="site-sub">Palácios da Memória · Medicina · Barceló</p>
</header>

<nav id="yearNav"></nav>

<main>
  <aside id="sidebar"></aside>
  <section class="content-area" id="contentArea"></section>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <div class="lightbox-body">
      <div class="lightbox-titulo" id="lightboxTitulo"></div>
      <div class="lightbox-desc" id="lightboxDesc"></div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="toggleAdmin()" title="Adicionar palácio">+</button>

<!-- Admin overlay -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-title">🏛 Novo palácio</div>

    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Ano</label>
        <select class="form-select" id="fAno">
          <option value="1">1º Ano</option>
          <option value="2">2º Ano</option>
          <option value="3">3º Ano</option>
          <option value="4">4º Ano</option>
          <option value="5">5º Ano</option>
          <option value="6">6º Ano</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">ERA</label>
        <select class="form-select" id="fEra">
          <option value="1">ERA 1</option>
          <option value="2">ERA 2</option>
          <option value="3">ERA 3</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">Matéria</label>
      <input class="form-input" id="fMateria" placeholder="ex: Neurofisiologia" list="materiasList" autocomplete="off">
      <datalist id="materiasList"></datalist>
    </div>

    <div class="form-row">
      <label class="form-label">Título do palácio</label>
      <input class="form-input" id="fTitulo" placeholder="ex: Potencial de Ação">
    </div>

    <div class="form-row">
      <label class="form-label">Descrição</label>
      <textarea class="form-textarea" id="fDesc" placeholder="O que está representado neste palácio..."></textarea>
    </div>

    <div class="form-row">
      <label class="form-label">Imagem</label>
      <input type="file" class="form-input" id="fImagem" accept="image/*" onchange="previewImg(this)">
      <p class="hint">PNG, JPG ou WebP. Salvo no navegador.</p>
      <img class="img-preview" id="imgPreview" alt="preview">
    </div>

    <button class="btn-save" onclick="salvarPalacio()">Salvar palácio</button>
    <button class="btn-cancel" onclick="toggleAdmin()">Cancelar</button>
  </div>
</div>

<script>
// ── STARFIELD ────────────────────────────────────────────────────────────────
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let W, H;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initStars(){
    stars = [];
    const count = Math.floor((W * H) / 3000);
    for(let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4,
        alpha: Math.random() * 0.8 + 0.1,
        speed: Math.random() * 0.3 + 0.05,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    const t = Date.now() * 0.001;
    stars.forEach(s => {
      s.twinkle += 0.008;
      const a = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,190,255,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  initStars();
  draw();
  window.addEventListener('resize', ()=>{ resize(); initStars(); });
})();

// ── CURSOR ───────────────────────────────────────────────────────────────────
(function(){
  const cur = document.getElementById('cur');
  const ring = document.getElementById('curRing');
  let mx=0, my=0, rx=0, ry=0;
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
  (function loop(){
    rx += (mx-rx)*0.12; ry += (my-ry)*0.12;
    cur.style.left = mx+'px'; cur.style.top = my+'px';
    ring.style.left = rx+'px'; ring.style.top = ry+'px';
    requestAnimationFrame(loop);
  })();
  document.addEventListener('mousedown', ()=>{ cur.style.width='6px'; cur.style.height='6px'; });
  document.addEventListener('mouseup', ()=>{ cur.style.width='10px'; cur.style.height='10px'; });
})();

// ── DATA ─────────────────────────────────────────────────────────────────────
function loadData(){ const s = localStorage.getItem('memorias_joao_v2'); return s ? JSON.parse(s) : { palacios: [] }; }
function saveData(d){ localStorage.setItem('memorias_joao_v2', JSON.stringify(d)); }

let db = loadData();
let currentYear = null;
let currentMateria = null;
let currentEra = '1';

// ── HELPERS ──────────────────────────────────────────────────────────────────
function getYears(){ const y=[...new Set(db.palacios.map(p=>p.ano))].sort(); return y.length?y:['1']; }
function getMaterias(yr){ return [...new Set(db.palacios.filter(p=>p.ano===yr).map(p=>p.materia))].sort(); }
function eraColor(e){ return e==='1'?'#f97316':e==='2'?'#a78bfa':'#34d399'; }

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderNav(){
  const nav = document.getElementById('yearNav');
  const years = getYears();
  if(!currentYear) currentYear = years[0];
  nav.innerHTML = years.map(y=>`
    <button class="year-tab ${y===currentYear?'active':''}" onclick="selectYear('${y}')">${y}º Ano</button>
  `).join('');
}

function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  const mats = getMaterias(currentYear);
  if(!currentMateria||!mats.includes(currentMateria)) currentMateria = mats[0]||null;
  if(!mats.length){ sidebar.innerHTML='<p style="font-size:0.8rem;color:var(--muted);padding:0.5rem">Nenhuma matéria.</p>'; return; }
  sidebar.innerHTML = `
    <div class="sidebar-label">Matérias</div>
    ${mats.map(m=>`
      <button class="materia-btn ${m===currentMateria?'active':''}" onclick="selectMateria('${m}')">${m}</button>
    `).join('')}`;
}

function renderContent(){
  const area = document.getElementById('contentArea');
  if(!currentMateria){
    area.innerHTML=`<div class="empty-state"><span class="empty-icon">🌌</span><p>Nenhum palácio ainda.<br>Clique no <strong>+</strong> para começar.</p></div>`;
    return;
  }
  const palacios = db.palacios.filter(p=>p.ano===currentYear&&p.materia===currentMateria&&p.era===currentEra);
  const eraCount = e => db.palacios.filter(p=>p.ano===currentYear&&p.materia===currentMateria&&p.era===e).length;

  area.innerHTML = `
    <div class="content-header">
      <div class="content-materia">${currentMateria}</div>
      <div class="content-breadcrumb">${currentYear}º Ano · Medicina Barceló</div>
    </div>
    <div class="era-tabs">
      ${['1','2','3'].map(e=>`
        <button class="era-btn ${e===currentEra?'active':''}" data-era="${e}" onclick="selectEra('${e}')">
          ERA ${e} <span style="opacity:0.55;font-size:0.7em">(${eraCount(e)})</span>
        </button>`).join('')}
    </div>
    ${palacios.length===0
      ? `<div class="empty-state"><span class="empty-icon">🏛</span><p>Nenhum palácio na ERA ${currentEra} de ${currentMateria}.<br>Clique no <strong>+</strong> para adicionar.</p></div>`
      : `<div class="palacio-grid">${palacios.map((p,i)=>renderCard(p,i)).join('')}</div>`}`;
}

function renderCard(p, i){
  const c = eraColor(p.era);
  const hasImg = p.imagem && p.imagem.length > 0;
  return `
    <div class="palacio-card" style="animation-delay:${i*0.06}s" onclick="openLightbox('${p.id}')">
      ${hasImg
        ? `<img class="palacio-img" src="${p.imagem}" alt="${p.titulo}" loading="lazy">`
        : `<div class="palacio-img-placeholder" style="background:linear-gradient(135deg,rgba(110,43,255,0.08),rgba(192,38,211,0.06))">sem imagem</div>`}
      <div class="palacio-info">
        <span class="palacio-era-badge" style="background:${c}22;color:${c};border:1px solid ${c}44">ERA ${p.era}</span>
        <div class="palacio-titulo">${p.titulo}</div>
        ${p.descricao?`<div class="palacio-desc">${p.descricao.substring(0,90)}${p.descricao.length>90?'…':''}</div>`:''}
      </div>
    </div>`;
}

function render(){ renderNav(); renderSidebar(); renderContent(); updateMateriasList(); }

// ── NAVIGATION ───────────────────────────────────────────────────────────────
function selectYear(y){ currentYear=y; currentMateria=null; render(); }
function selectMateria(m){ currentMateria=m; renderContent(); }
function selectEra(e){ currentEra=e; renderContent(); }

// ── LIGHTBOX ─────────────────────────────────────────────────────────────────
function openLightbox(id){
  const p = db.palacios.find(x=>x.id===id);
  if(!p) return;
  const img = document.getElementById('lightboxImg');
  img.src = p.imagem||'';
  img.style.display = p.imagem?'block':'none';
  document.getElementById('lightboxTitulo').textContent = p.titulo;
  document.getElementById('lightboxDesc').textContent = p.descricao||'';
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('lightbox').addEventListener('click', e=>{ if(e.target===document.getElementById('lightbox')) closeLightbox(); });

// ── ADMIN ────────────────────────────────────────────────────────────────────
function toggleAdmin(){
  const ov = document.getElementById('adminOverlay');
  ov.classList.toggle('open');
  if(ov.classList.contains('open')&&currentYear){
    document.getElementById('fAno').value = currentYear;
    document.getElementById('fEra').value = currentEra;
    if(currentMateria) document.getElementById('fMateria').value = currentMateria;
  }
}

function previewImg(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById('imgPreview');
    prev.src = e.target.result; prev.style.display='block';
  };
  reader.readAsDataURL(file);
}

function salvarPalacio(){
  const ano = document.getElementById('fAno').value;
  const era = document.getElementById('fEra').value;
  const materia = document.getElementById('fMateria').value.trim();
  const titulo = document.getElementById('fTitulo').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const imgInput = document.getElementById('fImagem');
  if(!materia||!titulo){ alert('Preencha matéria e título.'); return; }

  function finish(imgData){
    db.palacios.push({ id: Date.now().toString(), ano, era, materia, titulo, descricao: desc, imagem: imgData||'' });
    saveData(db);
    currentYear = ano; currentMateria = materia; currentEra = era;
    ['fMateria','fTitulo','fDesc'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fImagem').value='';
    document.getElementById('imgPreview').style.display='none';
    toggleAdmin();
    render();
  }

  if(imgInput.files[0]){ const r=new FileReader(); r.onload=e=>finish(e.target.result); r.readAsDataURL(imgInput.files[0]); }
  else finish('');
}

function updateMateriasList(){
  const all=[...new Set(db.palacios.map(p=>p.materia))].sort();
  const dl=document.getElementById('materiasList');
  if(dl) dl.innerHTML=all.map(m=>`<option value="${m}">`).join('');
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeLightbox(); document.getElementById('adminOverlay').classList.remove('open'); }
});

document.getElementById('adminOverlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('adminOverlay')) toggleAdmin();
});

render();
</script>
</body>
</html>
