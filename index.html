<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memórias do João</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👽</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #03020a;
  --deep: #070514;
  --nebula1: #6e2bff;
  --nebula2: #c026d3;
  --nebula3: #0ea5e9;
  --nebula4: #10b981;
  --star: #f0e6ff;
  --stardust: rgba(240,230,255,0.55);
  --glass: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.10);
  --era1: #f97316;
  --era2: #a78bfa;
  --era3: #34d399;
  --text: #e8e0ff;
  --muted: rgba(232,224,255,0.45);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--void);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  cursor: none;
}

@media (hover: none) and (pointer: coarse) {
  body { cursor: auto; }
  .cursor, .cursor-ring { display: none !important; }
}

/* ── CUSTOM CURSOR ── */
.cursor {
  position: fixed;
  width: 10px; height: 10px;
  background: var(--nebula1);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform 0.08s, width 0.2s, height 0.2s, background 0.2s;
  mix-blend-mode: screen;
}
.cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1px solid rgba(110,43,255,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%,-50%);
  transition: transform 0.18s ease-out, width 0.25s, height 0.25s;
}

/* ── STAR CANVAS ── */
#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── NEBULA BLOBS ── */
.nebula {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.18;
  animation: drift 18s ease-in-out infinite alternate;
}
.nb1 { width: 600px; height: 600px; background: var(--nebula1); top: -200px; left: -200px; animation-delay: 0s; }
.nb2 { width: 500px; height: 500px; background: var(--nebula2); bottom: -150px; right: -100px; animation-delay: -6s; }
.nb3 { width: 400px; height: 400px; background: var(--nebula3); top: 40%; left: 50%; animation-delay: -12s; }

@keyframes drift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(40px,30px) scale(1.08); }
}

/* ── HEADER ── */
header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 4rem 1rem 3rem;
}

.logo-orbit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 1px solid rgba(110,43,255,0.4);
  margin-bottom: 1.5rem;
  position: relative;
  animation: spin 12s linear infinite;
}
.logo-orbit::before {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  background: var(--nebula3);
  border-radius: 50%;
  top: -5px; left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 12px var(--nebula3);
}
@keyframes spin { to { transform: rotate(360deg); } }

.site-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2.2rem, 7vw, 4.5rem);
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, #c4b5fd 0%, #818cf8 40%, #38bdf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.03em;
}

.site-sub {
  margin-top: 0.6rem;
  font-size: 0.8rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 300;
}

/* ── YEAR NAV ── */
nav {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 0 1rem 2rem;
  flex-wrap: wrap;
}

.year-tab {
  font-family: 'Outfit', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0.45rem 1.2rem;
  cursor: pointer;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  border-radius: 99px;
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}
.year-tab:hover { color: var(--text); border-color: rgba(110,43,255,0.5); }
.year-tab.active {
  color: #fff;
  background: linear-gradient(135deg, var(--nebula1), var(--nebula2));
  border-color: transparent;
  box-shadow: 0 0 20px rgba(110,43,255,0.4);
}

/* ── MAIN LAYOUT ── */
main {
  position: relative;
  z-index: 10;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1.5rem 6rem;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 2rem;
}

@media (max-width: 720px) {
  main { grid-template-columns: 1fr; }
  aside { position: static !important; }
}

/* ── SIDEBAR ── */
aside {
  position: sticky;
  top: 1.5rem;
  align-self: start;
}

.sidebar-label {
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 0.6rem;
  padding-left: 0.75rem;
}

.materia-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  color: var(--muted);
  padding: 0.55rem 0.75rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.18s;
  border-left: 2px solid transparent;
  position: relative;
}
.materia-btn:hover { color: var(--text); background: var(--glass); }
.materia-btn.active {
  color: #c4b5fd;
  background: rgba(110,43,255,0.12);
  border-left-color: var(--nebula1);
  font-weight: 500;
}

/* ── CONTENT AREA ── */
.content-area { min-height: 400px; }

.content-header {
  margin-bottom: 1.5rem;
}

.content-materia {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.4rem, 3vw, 2rem);
  font-weight: 700;
  color: var(--star);
  line-height: 1.2;
}

.content-breadcrumb {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 0.3rem;
  letter-spacing: 0.06em;
}

/* ── ERA PILLS ── */
.era-tabs {
  display: flex;
  gap: 0.6rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.era-btn {
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.45rem 1.1rem;
  border-radius: 99px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.2s;
  background: transparent;
  position: relative;
  overflow: hidden;
}

.era-btn[data-era="1"] { color: var(--era1); border-color: rgba(249,115,22,0.4); }
.era-btn[data-era="1"].active {
  background: var(--era1); color: #0a0500; border-color: var(--era1);
  box-shadow: 0 0 20px rgba(249,115,22,0.4);
}
.era-btn[data-era="2"] { color: var(--era2); border-color: rgba(167,139,250,0.4); }
.era-btn[data-era="2"].active {
  background: var(--era2); color: #07041a; border-color: var(--era2);
  box-shadow: 0 0 20px rgba(167,139,250,0.4);
}
.era-btn[data-era="3"] { color: var(--era3); border-color: rgba(52,211,153,0.4); }
.era-btn[data-era="3"].active {
  background: var(--era3); color: #020f09; border-color: var(--era3);
  box-shadow: 0 0 20px rgba(52,211,153,0.4);
}

/* ── CARD GRID ── */
.palacio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.25rem;
}

.palacio-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(.22,.68,0,1.2), box-shadow 0.25s, border-color 0.25s;
  backdrop-filter: blur(12px);
  animation: cardIn 0.4s ease both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.palacio-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(110,43,255,0.45);
  box-shadow: 0 16px 48px rgba(110,43,255,0.2), 0 0 0 1px rgba(110,43,255,0.2);
}

.palacio-img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}

.palacio-img-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(110,43,255,0.1), rgba(192,38,211,0.08));
  color: var(--muted);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}

.palacio-info {
  padding: 1rem 1.1rem 1.1rem;
  border-top: 1px solid var(--glass-border);
}

.palacio-titulo {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--star);
  margin-bottom: 0.3rem;
}

.palacio-desc {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.55;
}

.palacio-era-badge {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  margin-bottom: 0.4rem;
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--muted);
}
.empty-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  display: block;
  opacity: 0.5;
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.empty-state p { font-size: 0.9rem; line-height: 1.7; }

/* ── LIGHTBOX ── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(3,2,10,0.92);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(16px);
}
.lightbox.open { display: flex; }

.lightbox-inner {
  max-width: 860px;
  width: 100%;
  background: rgba(15,8,40,0.95);
  border: 1px solid rgba(110,43,255,0.3);
  border-radius: 20px;
  overflow: hidden;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 80px rgba(110,43,255,0.2);
  animation: lbIn 0.25s cubic-bezier(.22,.68,0,1.2);
}
@keyframes lbIn {
  from { opacity:0; transform: scale(0.92); }
  to   { opacity:1; transform: scale(1); }
}

.lightbox-img {
  width: 100%;
  max-height: 60vh;
  object-fit: contain;
  background: rgba(0,0,0,0.3);
  display: block;
}

.lightbox-body {
  padding: 1.5rem;
  border-top: 1px solid rgba(110,43,255,0.2);
  overflow-y: auto;
}

.lightbox-titulo {
  font-family: 'Syne', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--star);
  margin-bottom: 0.5rem;
}

.lightbox-desc {
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.7;
}

.lightbox-close {
  position: absolute;
  top: 1.25rem;
  right: 1.25rem;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  font-size: 1rem;
  width: 38px; height: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.lightbox-close:hover { background: rgba(255,255,255,0.15); }

/* ── FAB ADD ── */
.fab {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  z-index: 500;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, var(--nebula1), var(--nebula2));
  color: white;
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(110,43,255,0.5), 0 4px 16px rgba(0,0,0,0.4);
  transition: transform 0.2s cubic-bezier(.22,.68,0,1.2), box-shadow 0.2s;
  font-weight: 300;
  line-height: 1;
}
.fab:hover {
  transform: scale(1.12) rotate(90deg);
  box-shadow: 0 0 40px rgba(110,43,255,0.7), 0 6px 24px rgba(0,0,0,0.4);
}

/* ── ADMIN PANEL ── */
.admin-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(3,2,10,0.88);
  z-index: 600;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(12px);
}
.admin-overlay.open { display: flex; }

.admin-panel {
  background: rgba(10,6,30,0.98);
  border: 1px solid rgba(110,43,255,0.3);
  border-radius: 20px;
  padding: 2rem;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(110,43,255,0.15);
  animation: lbIn 0.25s cubic-bezier(.22,.68,0,1.2);
}

.admin-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--star);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.form-row { margin-bottom: 1rem; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
@media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }

.form-label {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.4rem;
  font-weight: 500;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 0.65rem 0.9rem;
  border: 1px solid rgba(110,43,255,0.25);
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--nebula1);
  box-shadow: 0 0 0 3px rgba(110,43,255,0.15);
}
.form-select option { background: #0a0620; }
.form-textarea { resize: vertical; min-height: 80px; }

.btn-save {
  width: 100%;
  margin-top: 0.75rem;
  padding: 0.8rem;
  border: none;
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, var(--nebula1), var(--nebula2));
  color: white;
  letter-spacing: 0.04em;
  transition: opacity 0.15s, transform 0.15s;
}
.btn-save:hover { opacity: 0.9; transform: translateY(-1px); }

.btn-cancel {
  width: 100%;
  margin-top: 0.5rem;
  padding: 0.7rem;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  transition: color 0.15s, border-color 0.15s;
}
.btn-cancel:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

.img-preview {
  width: 100%;
  border-radius: 10px;
  margin-top: 0.5rem;
  display: none;
  border: 1px solid rgba(110,43,255,0.2);
}

.hint {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 0.3rem;
}

/* ── SEARCH BAR ── */
.search-wrap {
  position: relative;
  z-index: 100;
  max-width: 520px;
  margin: 0 auto 2rem;
  padding: 0 1rem;
}
.search-input {
  width: 100%;
  padding: 0.75rem 1rem 0.75rem 2.8rem;
  border: 1px solid rgba(110,43,255,0.3);
  border-radius: 99px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.92rem;
  background: rgba(255,255,255,0.05);
  color: var(--text);
  outline: none;
  backdrop-filter: blur(12px);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus {
  border-color: var(--nebula1);
  box-shadow: 0 0 0 3px rgba(110,43,255,0.15), 0 0 20px rgba(110,43,255,0.1);
}
.search-icon {
  position: absolute;
  left: 1.9rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 0.95rem;
  pointer-events: none;
}
.search-results {
  position: absolute;
  top: calc(100% + 8px);
  left: 1rem;
  right: 1rem;
  background: rgba(10,6,30,0.97);
  border: 1px solid rgba(110,43,255,0.25);
  border-radius: 14px;
  overflow: hidden;
  z-index: 9000;
  display: none;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  backdrop-filter: blur(16px);
}
.search-results.show { display: block; }
.search-result-item {
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: rgba(110,43,255,0.12); }
.sr-titulo { font-size: 0.9rem; color: var(--star); font-weight: 500; }
.sr-meta { font-size: 0.72rem; color: var(--muted); }
.sr-highlight { color: var(--nebula2); font-weight: 600; }
.search-empty { padding: 1.2rem; text-align: center; color: var(--muted); font-size: 0.85rem; }

/* ── SPLASH SCREEN ── */
#splash {
  position: fixed;
  inset: 0;
  z-index: 8000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--void);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
#splash.hide {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.04);
}
.splash-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.splash-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 1rem;
}
.splash-et {
  font-size: clamp(3rem, 10vw, 6rem);
  display: block;
  animation: etFloat 3s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(110,43,255,0.6));
  margin-bottom: 1rem;
}
@keyframes etFloat {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50%      { transform: translateY(-18px) rotate(3deg); }
}
.splash-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2rem, 7vw, 4rem);
  font-weight: 800;
  background: linear-gradient(135deg, #c4b5fd 0%, #818cf8 40%, #38bdf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.03em;
  margin-bottom: 0.5rem;
}
.splash-sub {
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2.5rem;
}
.splash-btn {
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  padding: 0.85rem 2.5rem;
  border-radius: 99px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, var(--nebula1), var(--nebula2));
  color: white;
  letter-spacing: 0.04em;
  box-shadow: 0 0 30px rgba(110,43,255,0.4);
  transition: transform 0.2s cubic-bezier(.22,.68,0,1.2), box-shadow 0.2s;
  animation: pulseBtn 2.5s ease-in-out infinite;
}
.splash-btn:hover {
  transform: scale(1.06);
  box-shadow: 0 0 50px rgba(110,43,255,0.6);
}
@keyframes pulseBtn {

<script>
// ── STARFIELD ────────────────────────────────────────────────────────────────
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let W, H;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initStars(){
    stars = [];
    const count = Math.floor((W * H) / 3000);
    for(let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4,
        alpha: Math.random() * 0.8 + 0.1,
        speed: Math.random() * 0.3 + 0.05,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    const t = Date.now() * 0.001;
    stars.forEach(s => {
      s.twinkle += 0.008;
      const a = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,190,255,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  initStars();
  draw();
  window.addEventListener('resize', ()=>{ resize(); initStars(); });
})();

// ── CURSOR (apenas desktop) ───────────────────────────────────────────────────
if(window.matchMedia('(hover: hover) and (pointer: fine)').matches){
  (function(){
    const cur = document.getElementById('cur');
    const ring = document.getElementById('curRing');
    let mx=0, my=0, rx=0, ry=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
    (function loop(){
      rx += (mx-rx)*0.12; ry += (my-ry)*0.12;
      cur.style.left = mx+'px'; cur.style.top = my+'px';
      ring.style.left = rx+'px'; ring.style.top = ry+'px';
      requestAnimationFrame(loop);
    })();
    document.addEventListener('mousedown', ()=>{ cur.style.width='6px'; cur.style.height='6px'; });
    document.addEventListener('mouseup',   ()=>{ cur.style.width='10px'; cur.style.height='10px'; });
  })();
}

// ── SPLASH ───────────────────────────────────────────────────────────────────
(function(){
  const canvas = document.getElementById('splashCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], emojis = ['🧠','🏛','⚗️','🔬','💊','🫀','🫁','🧬','⚡','🌌','👽','✨','💉','🩺'];
  let running = true;

  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }

  function spawnParticle(){
    return {
      x: Math.random() * W,
      y: H + 60,
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
      size: 20 + Math.random() * 28,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(0.6 + Math.random() * 1.2),
      alpha: 0,
      fadeIn: true,
      rot: (Math.random() - 0.5) * 0.04,
      angle: Math.random() * Math.PI * 2,
      life: 0,
      maxLife: 220 + Math.random() * 120
    };
  }

  function init(){
    particles = [];
    for(let i = 0; i < 18; i++){
      const p = spawnParticle();
      p.y = Math.random() * H;
      p.life = Math.random() * p.maxLife;
      p.alpha = 0.3 + Math.random() * 0.4;
      p.fadeIn = false;
      particles.push(p);
    }
  }

  function draw(){
    if(!running) return;
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.angle += p.rot; p.life++;
      if(p.fadeIn && p.alpha < 0.7) p.alpha += 0.02;
      if(p.life > p.maxLife - 40) p.alpha -= 0.018;
      if(p.life > p.maxLife || p.y < -80){
        Object.assign(p, spawnParticle());
        return;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.font = p.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, 0, 0);
      ctx.restore();
    });
    if(particles.length < 22 && Math.random() < 0.03) particles.push(spawnParticle());
    requestAnimationFrame(draw);
  }

  resize(); init(); draw();
  window.addEventListener('resize', ()=>{ resize(); });
})();

function enterSite(){
  const splash = document.getElementById('splash');
  splash.classList.add('hide');
  setTimeout(()=>{ splash.style.display='none'; }, 800);
}
(function(){
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  function highlight(text, query){
    if(!query) return text;
    const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    return text.replace(re, '<span class="sr-highlight">$1</span>');
  }

  function search(q){
    if(!q || q.length < 2){ results.classList.remove('show'); return; }
    const lower = q.toLowerCase();
    const found = db.palacios.filter(p =>
      p.titulo.toLowerCase().includes(lower) ||
      p.materia.toLowerCase().includes(lower) ||
      (p.descricao||'').toLowerCase().includes(lower)
    ).slice(0, 8);

    if(!found.length){
      results.innerHTML = '<div class="search-empty">Nenhum resultado encontrado</div>';
    } else {
      results.innerHTML = found.map(p => `
        <div class="search-result-item" onclick="goToPalacio('${p.ano}','${p.materia}','${p.era}','${p.id}')">
          <div class="sr-titulo">${highlight(p.titulo, q)}</div>
          <div class="sr-meta">${highlight(p.materia, q)} · ${p.ano}º Ano · ERA ${p.era}</div>
        </div>
      `).join('');
    }
    results.classList.add('show');
  }

  input.addEventListener('input', e => search(e.target.value.trim()));
  input.addEventListener('keydown', e => { if(e.key==='Escape'){ results.classList.remove('show'); input.blur(); } });
  document.addEventListener('click', e => { if(!e.target.closest('.search-wrap')) results.classList.remove('show'); });
})();

function goToPalacio(ano, materia, era, id){
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('searchInput').value = '';
  currentYear = String(ano);
  currentMateria = materia;
  currentEra = String(era);
  render();
  setTimeout(()=>{
    const card = document.querySelector(`.palacio-card[onclick*="${id}"]`);
    if(card){ card.scrollIntoView({behavior:'smooth', block:'center'}); openLightbox(id); }
  }, 150);
}

// ── CONFIG ───────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzoINeeXVuDiCE6u0C_N34wr-EfGdYWuFJ-onZhZliN8lERUzZhwX3DQhJS1956xg-V/exec';
const OWNER_PWD  = 'joao2025';

// ── STATE ────────────────────────────────────────────────────────────────────
let db = { palacios: [] };
let currentYear    = null;
let currentMateria = null;
let currentEra     = '1';
let ownerMode      = false;

// ── HELPERS ──────────────────────────────────────────────────────────────────
function getYears(){ const y=[...new Set(db.palacios.map(p=>String(p.ano)))].sort(); return y.length?y:['5']; }
function getMaterias(yr){ return [...new Set(db.palacios.filter(p=>String(p.ano)===String(yr)).map(p=>p.materia))].sort(); }
function eraColor(e){ return e==='1'?'#f97316':e==='2'?'#a78bfa':'#34d399'; }

function setLoading(msg){
  document.getElementById('contentArea').innerHTML=`<div class="empty-state"><span class="empty-icon" style="font-size:1.5rem;animation:none">⏳</span><p>${msg}</p></div>`;
}

// ── API ──────────────────────────────────────────────────────────────────────
async function apiGet(){
  try {
    const r = await fetch(SCRIPT_URL);
    const data = await r.json();
    db.palacios = Array.isArray(data) ? data.map(p=>({...p, ano:String(p.ano), era:String(p.era)})) : [];
  } catch(e){ db.palacios = []; }
}

async function apiPost(body){
  await fetch(SCRIPT_URL, {
    method:'POST',
    body: JSON.stringify(body)
  });
}

// ── DRIVE IMAGE UPLOAD ───────────────────────────────────────────────────────
// Converte arquivo para link público do Drive via base64 no Apps Script
// Como não temos upload direto, salvamos a imagem como base64 na planilha
// (funciona para imagens pequenas/médias — ideal para desenhos)

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderNav(){
  const nav = document.getElementById('yearNav');
  const years = getYears();
  if(!currentYear||!years.includes(currentYear)) currentYear = years[0];
  nav.innerHTML = years.map(y=>`
    <button class="year-tab ${y===currentYear?'active':''}" onclick="selectYear('${y}')">${y}º Ano</button>
  `).join('');
}

function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  const mats = getMaterias(currentYear);
  if(!currentMateria||!mats.includes(currentMateria)) currentMateria = mats[0]||null;
  if(!mats.length){ sidebar.innerHTML='<p style="font-size:0.8rem;color:var(--muted);padding:0.5rem">Nenhuma matéria.</p>'; return; }
  sidebar.innerHTML = `
    <div class="sidebar-label">Matérias</div>
    ${mats.map(m=>`
      <button class="materia-btn ${m===currentMateria?'active':''}" onclick="selectMateria('${m}')">${m}</button>
    `).join('')}`;
}

function renderContent(){
  const area = document.getElementById('contentArea');
  if(!currentMateria){
    area.innerHTML=`<div class="empty-state"><span class="empty-icon">🌌</span><p>Nenhum palácio ainda.<br>${ownerMode?'Clique no <strong>+</strong> para começar.':'Em breve...'}</p></div>`;
    return;
  }
  const palacios = db.palacios.filter(p=>String(p.ano)===String(currentYear)&&p.materia===currentMateria&&String(p.era)===String(currentEra));
  const eraCount = e => db.palacios.filter(p=>String(p.ano)===String(currentYear)&&p.materia===currentMateria&&String(p.era)===String(e)).length;

  area.innerHTML = `
    <div class="content-header">
      <div class="content-materia">${currentMateria}</div>
      <div class="content-breadcrumb">${currentYear}º Ano · Medicina Barceló</div>
    </div>
    <div class="era-tabs">
      ${['1','2','3'].map(e=>`
        <button class="era-btn ${e===currentEra?'active':''}" data-era="${e}" onclick="selectEra('${e}')">
          ERA ${e} <span style="opacity:0.55;font-size:0.7em">(${eraCount(e)})</span>
        </button>`).join('')}
    </div>
    ${palacios.length===0
      ? `<div class="empty-state"><span class="empty-icon">🏛</span><p>Nenhum palácio na ERA ${currentEra} de ${currentMateria}.</p></div>`
      : `<div class="palacio-grid">${palacios.map((p,i)=>renderCard(p,i)).join('')}</div>`}`;
}

function renderCard(p, i){
  const c = eraColor(String(p.era));
  const hasImg = p.imagem && p.imagem.length > 0;
  return `
    <div class="palacio-card" style="animation-delay:${i*0.06}s" onclick="openLightbox('${p.id}')">
      ${hasImg
        ? `<img class="palacio-img" src="${p.imagem}" alt="${p.titulo}" loading="lazy">`
        : `<div class="palacio-img-placeholder">sem imagem</div>`}
      <div class="palacio-info">
        <span class="palacio-era-badge" style="background:${c}22;color:${c};border:1px solid ${c}44">ERA ${p.era}</span>
        <div class="palacio-titulo">${p.titulo}</div>
        ${p.descricao?`<div class="palacio-desc">${p.descricao.substring(0,90)}${p.descricao.length>90?'…':''}</div>`:''}
      </div>
      <div class="card-actions">
        <button class="card-action-btn btn-edit-card" onclick="event.stopPropagation();openEdit('${p.id}')" title="Editar">✏️</button>
        <button class="card-action-btn btn-del-card"  onclick="event.stopPropagation();deletePalacio('${p.id}')" title="Excluir">🗑</button>
      </div>
    </div>`;
}

function render(){ renderNav(); renderSidebar(); renderContent(); updateMateriasList(); }

async function loadAndRender(){
  setLoading('Carregando palácios...');
  await apiGet();
  render();
}

// ── NAVIGATION ───────────────────────────────────────────────────────────────
function selectYear(y){ currentYear=y; currentMateria=null; render(); }
function selectMateria(m){ currentMateria=m; renderContent(); }
function selectEra(e){ currentEra=e; renderContent(); }

// ── LIGHTBOX ─────────────────────────────────────────────────────────────────
function openLightbox(id){
  const p = db.palacios.find(x=>String(x.id)===String(id));
  if(!p) return;
  const img = document.getElementById('lightboxImg');
  img.src = p.imagem||'';
  img.style.display = p.imagem?'block':'none';
  document.getElementById('lightboxTitulo').textContent = p.titulo;
  document.getElementById('lightboxDesc').textContent = p.descricao||'';
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('lightbox').addEventListener('click', e=>{ if(e.target===document.getElementById('lightbox')) closeLightbox(); });

// ── OWNER MODE ───────────────────────────────────────────────────────────────
function requestOwner(){
  if(ownerMode){ deactivateOwner(); return; }
  document.getElementById('pwdOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('pwdInput').focus(), 100);
}

function checkPwd(){
  const val = document.getElementById('pwdInput').value;
  if(val === OWNER_PWD){
    ownerMode = true;
    document.getElementById('pwdOverlay').classList.remove('open');
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdErr').classList.remove('show');
    document.getElementById('ownerBtn').classList.add('active');
    document.body.classList.add('owner-mode');
    document.querySelector('.fab').style.display = 'flex';
    render();
  } else {
    document.getElementById('pwdErr').classList.add('show');
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

function deactivateOwner(){
  ownerMode = false;
  document.getElementById('ownerBtn').classList.remove('active');
  document.body.classList.remove('owner-mode');
  document.querySelector('.fab').style.display = 'none';
  render();
}

function closePwd(){
  document.getElementById('pwdOverlay').classList.remove('open');
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdErr').classList.remove('show');
}

document.getElementById('pwdInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPwd(); });
document.getElementById('pwdOverlay').addEventListener('click', e=>{ if(e.target===document.getElementById('pwdOverlay')) closePwd(); });

// ── ADMIN — ADICIONAR ────────────────────────────────────────────────────────
function toggleAdmin(){
  if(!ownerMode) return;
  const ov = document.getElementById('adminOverlay');
  ov.classList.toggle('open');
  if(ov.classList.contains('open')&&currentYear){
    document.getElementById('fAno').value = currentYear;
    document.getElementById('fEra').value = currentEra;
    if(currentMateria) document.getElementById('fMateria').value = currentMateria;
  }
}

function driveLink(url){
  if(!url) return '';
  // Converte link de compartilhamento para link direto de imagem
  const m = url.match(/[-\w]{25,}/);
  if(m) return 'https://drive.google.com/uc?export=view&id='+m[0];
  return url;
}

async function salvarPalacio(){
  const ano    = document.getElementById('fAno').value;
  const era    = document.getElementById('fEra').value;
  const materia= document.getElementById('fMateria').value.trim();
  const titulo = document.getElementById('fTitulo').value.trim();
  const desc   = document.getElementById('fDesc').value.trim();
  const imgUrl = driveLink(document.getElementById('fImagem').value.trim());
  if(!materia||!titulo){ alert('Preencha matéria e título.'); return; }

  const saveBtn = document.querySelector('#adminOverlay .btn-save');
  saveBtn.textContent = 'Salvando...'; saveBtn.disabled = true;

  const palacio = { action:'add', id: Date.now().toString(), ano, era, materia, titulo, descricao:desc, imagem:imgUrl };
  await apiPost(palacio);
  db.palacios.push({...palacio});
  currentYear=ano; currentMateria=materia; currentEra=era;
  ['fMateria','fTitulo','fDesc','fImagem'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('imgPreview').style.display='none';
  saveBtn.textContent='Salvar palácio'; saveBtn.disabled=false;
  document.getElementById('adminOverlay').classList.remove('open');
  render();
}

function updateMateriasList(){
  const all=[...new Set(db.palacios.map(p=>p.materia))].sort();
  ['materiasList','materiasList2'].forEach(id=>{
    const dl=document.getElementById(id);
    if(dl) dl.innerHTML=all.map(m=>`<option value="${m}">`).join('');
  });
}

// ── EDIT ─────────────────────────────────────────────────────────────────────
function openEdit(id){
  if(!ownerMode) return;
  const p = db.palacios.find(x=>String(x.id)===String(id));
  if(!p) return;
  document.getElementById('eId').value      = p.id;
  document.getElementById('eAno').value     = p.ano;
  document.getElementById('eEra').value     = p.era;
  document.getElementById('eMateria').value = p.materia;
  document.getElementById('eTitulo').value  = p.titulo;
  document.getElementById('eDesc').value    = p.descricao||'';
  const prev = document.getElementById('eImgPreview');
  if(p.imagem){ prev.src=p.imagem; prev.style.display='block'; } else { prev.style.display='none'; }
  document.getElementById('eImagem').value='';
  document.getElementById('editOverlay').classList.add('open');
  updateMateriasList();
}

function closeEdit(){ document.getElementById('editOverlay').classList.remove('open'); }

async function salvarEdicao(){
  const id  = document.getElementById('eId').value;
  const idx = db.palacios.findIndex(x=>String(x.id)===String(id));
  if(idx===-1) return;
  const novoLink = document.getElementById('eImagem').value.trim();
  const saveBtn  = document.querySelector('#editOverlay .btn-save-edit');
  saveBtn.textContent='Salvando...'; saveBtn.disabled=true;

  const updated = {
    action:'update',
    id,
    ano:      document.getElementById('eAno').value,
    era:      document.getElementById('eEra').value,
    materia:  document.getElementById('eMateria').value.trim(),
    titulo:   document.getElementById('eTitulo').value.trim(),
    descricao:document.getElementById('eDesc').value.trim(),
    imagem:   novoLink ? driveLink(novoLink) : db.palacios[idx].imagem
  };
  await apiPost(updated);
  db.palacios[idx] = {...updated};
  currentYear=updated.ano; currentMateria=updated.materia; currentEra=updated.era;
  saveBtn.textContent='Salvar alterações'; saveBtn.disabled=false;
  closeEdit();
  render();
}

async function deletePalacio(id){
  if(!ownerMode) return;
  if(!confirm('Excluir este palácio? Não tem volta.')) return;
  await apiPost({ action:'delete', id });
  db.palacios = db.palacios.filter(x=>String(x.id)!==String(id));
  render();
}

document.getElementById('editOverlay').addEventListener('click', e=>{ if(e.target===document.getElementById('editOverlay')) closeEdit(); });
document.getElementById('adminOverlay').addEventListener('click', e=>{ if(e.target===document.getElementById('adminOverlay')) toggleAdmin(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeLightbox(); document.getElementById('adminOverlay').classList.remove('open'); closeEdit(); closePwd(); }
});

// ── INIT ─────────────────────────────────────────────────────────────────────
document.querySelector('.fab').style.display = 'none';
loadAndRender();
</script>
</body>
</html>
